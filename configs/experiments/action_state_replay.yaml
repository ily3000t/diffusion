schema_version: sumodiff.control_replay.protocol.v1
dataset: artifacts/processed/stage5a-fresh/dataset
task_plan: configs\experiments\action_state_replay_tasks.json
seed: 20261028
methods:
  center_midpoint:
    dt: 0.1
    reference_point: center
    integration_heading: midpoint
    lateral_velocity: false
    compute_dtype: float64
    heading_epsilon: 1.0e-06
  center_endpoint:
    dt: 0.1
    reference_point: center
    integration_heading: endpoint
    lateral_velocity: false
    compute_dtype: float64
    heading_epsilon: 1.0e-06
  front_midpoint:
    dt: 0.1
    reference_point: front
    integration_heading: midpoint
    lateral_velocity: false
    compute_dtype: float64
    heading_epsilon: 1.0e-06
  front_endpoint:
    dt: 0.1
    reference_point: front
    integration_heading: endpoint
    lateral_velocity: false
    compute_dtype: float64
    heading_epsilon: 1.0e-06
  center_midpoint_lateral:
    dt: 0.1
    reference_point: center
    integration_heading: midpoint
    lateral_velocity: true
    compute_dtype: float64
    heading_epsilon: 1.0e-06
gate:
  max_position_error_m: 0.05
  max_heading_error_rad: 1.0e-05
  max_velocity_error_mps: 0.05
evaluation:
  motion:
    max_speed_mps: 35.0
    max_longitudinal_accel_mps2: 6.0
    max_lateral_accel_mps2: 6.0
    max_jerk_mps3: 15.0
    max_yaw_rate_radps: 3.0
    max_heading_velocity_angle_rad: 0.7853981633974483
    moving_speed_min_mps: 0.5
    heading_norm_tolerance: 0.1
    max_velocity_residual_mps: 0.5
    comfort_longitudinal_accel_mps2: 3.0
    comfort_lateral_accel_mps2: 3.0
    comfort_jerk_mps3: 5.0
  road:
    numerical_tolerance_m: 1.0e-06
    geometry_repair: bounded_make_valid
    max_repair_area_change_m2: 1.0e-06
    max_repair_hausdorff_m: 1.0e-06
  collision:
    contact_tolerance_m: 1.0e-09
    rotation_zero_tolerance_rad: 1.0e-12
    rotating_time_resolution_s: 0.0001
    max_depth: 12
    max_evaluations_per_interval: 256
